<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="description" content="Aplikasi pencatatan usaha ikan: stok, pembelian, penjualan, pakan, hutang-piutang, laba dan laporan.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<title>Usaha Ikan</title>
<style>
:root{--primary:#0f766e;--primary2:#115e59;--bg:#f4f7f8;--card:#fff;--text:#17202a;--muted:#6b7280;--danger:#dc2626;--ok:#15803d;--border:#e5e7eb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.app{display:flex;min-height:100vh}
aside{width:245px;background:#073b3a;color:#fff;padding:18px;position:sticky;top:0;height:100vh}
.brand{font-size:21px;font-weight:800;margin:8px 4px 20px}.brand small{display:block;font-size:11px;font-weight:400;opacity:.7;margin-top:2px}
nav button{width:100%;text-align:left;background:transparent;color:#d9fffa;padding:11px 12px;border-radius:10px;margin:3px 0}nav button.active,nav button:hover{background:#0f766e;color:#fff}
main{flex:1;padding:20px;max-width:1500px;margin:auto;width:100%}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px}.top h1{margin:0;font-size:25px}
.mobile-nav{display:none}.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;box-shadow:0 2px 8px #00000008}.metric .label{color:var(--muted);font-size:12px}.metric .value{font-size:23px;font-weight:800;margin-top:5px}.ok{color:var(--ok)}.bad{color:var(--danger)}
table{width:100%;border-collapse:collapse}th,td{padding:9px 8px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}th{font-size:12px;color:var(--muted);font-weight:700}td.num,th.num{text-align:right}.scroll{overflow:auto}
.btn{padding:9px 13px;border-radius:9px;background:#e7f5f3;color:var(--primary);font-weight:700}.btn.primary{background:var(--primary);color:#fff}.btn.danger{background:#fee2e2;color:#991b1b}.btn.dark{background:#1f2937;color:#fff}.btn.sm{padding:6px 9px;font-size:12px}
.form{display:grid;gap:11px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:650}.field input,.field select,.field textarea{width:100%;padding:9px 10px;border:1px solid #d1d5db;border-radius:8px;background:#fff}.actions{display:flex;gap:8px;flex-wrap:wrap}.section{margin-bottom:16px}.section h2{font-size:17px;margin:0 0 12px}
.toolbar{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:12px}.toolbar .right{display:flex;gap:8px;flex-wrap:wrap}
.badge{display:inline-block;padding:3px 7px;border-radius:99px;background:#eef2ff;font-size:11px}.badge.ok{background:#dcfce7}.badge.bad{background:#fee2e2}
.empty{text-align:center;color:var(--muted);padding:30px}.hidden{display:none!important}
.toast{position:fixed;right:18px;bottom:18px;background:#111827;color:#fff;padding:11px 14px;border-radius:9px;display:none;z-index:99}
hr{border:0;border-top:1px solid var(--border);margin:15px 0}
@media(max-width:900px){aside{display:none}.mobile-nav{display:flex;position:sticky;top:0;z-index:20;background:#073b3a;overflow:auto;padding:7px;gap:5px}.mobile-nav button{white-space:nowrap;color:#d9fffa;background:transparent;padding:8px 10px;border-radius:8px}.mobile-nav button.active{background:#0f766e}.g4,.g3{grid-template-columns:repeat(2,minmax(0,1fr))}main{padding:14px}}
@media(max-width:580px){.g4,.g3,.g2{grid-template-columns:1fr}.top h1{font-size:21px}.card{padding:13px}}
@media print{aside,.mobile-nav,.no-print,.top .actions{display:none!important}main{padding:0;max-width:none}.card{box-shadow:none;border:0}.print-area{display:block!important}}
</style>
</head>
<body>
<div class="app">
<aside>
  <div class="brand">🐟 Usaha Ikan<small>Manajemen usaha sederhana</small></div>
  <nav id="sideNav"></nav>
</aside>
<div style="flex:1">
  <div class="mobile-nav" id="mobileNav"></div>
  <main id="app"></main>
</div>
</div>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
